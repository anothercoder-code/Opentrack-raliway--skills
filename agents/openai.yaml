interface:
  display_name: "OpenTrack Network Rail"
  short_description: "Plan, build and verify railway projects with OpenTrack"
  default_prompt: "使用 $opentrack-network-rail：先确认有效的原版 OpenTrack 完整版授权，再把需求整理成结构化事实和验收断言，检查实际工程与 SHA，发现并按依赖组合语义能力，生成包含预览、副作用、回滚和证据边界的有向计划。默认保留原工程；面对真实车站必须逐项核对股道、岛式站面、连续站台跨度、停车标、出口信号和咽喉连通，无法证明的复杂道岔或非连续站台报告 unsupported。不得为每个原版函数制造一一对应求解器，也不得用固定站数模板替代需求。离线阶段完成后，把原版加载、GUI Save、真正重载、Inspector、实际停站和开行验证集中留到统一原生验收。"
